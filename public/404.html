<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Easy PDF Local</title>
    <meta
      name="description"
      content="Esta página não existe no Easy PDF Local. Volte ao início ou ao guia PDF sem upload."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="canonical" href="https://easypdflocal.com.br/" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      .code {
        margin: 0;
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #cbd5e1;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0.75rem 0 0;
        line-height: 1.5;
        color: #475569;
        font-size: 0.95rem;
      }
      @media (prefers-color-scheme: dark) {
        .code {
          color: #1e293b;
        }
        p {
          color: #94a3b8;
        }
      }
      nav {
        margin-top: 1.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      .home {
        background: #dc2626;
        color: #fff;
      }
      .hub {
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        .hub {
          border-color: #334155;
          background: #0f172a;
          color: #f1f5f9;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>
        O endereço não existe neste site. Volte ao início ou leia como o PDF é
        processado no navegador.
      </p>
      <nav>
        <a class="home" href="/">Início</a>
        <a class="hub" href="/pdf-sem-upload">PDF sem upload</a>
      </nav>
    </main>
  </body>
</html>
