# Build com Playwright (HTML por rota) + deploy Cloudflare Worker (assets)
#
# Este projeto NÃO usa Cloudflare Pages.
# O Worker de produção chama-se "easypdf" e é publicado com:
#   wrangler deploy
# (não `wrangler pages deploy`)
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token com Workers Scripts Edit (+ Account read)
#   CLOUDFLARE_ACCOUNT_ID  — Account ID do dashboard
#   CLOUDFLARE_WORKER_NAME — (opcional) default: easypdf
#
# Docs: docs/PRERENDER.md  |  wrangler.toml

name: Build (Playwright prerender) + Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Prerender + Deploy Worker
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy

    env:
      PRERENDER_STRICT: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright Chromium
        run: npx playwright install chromium

      - name: Build (tsc + vite + prerender)
        run: npm run build

      - name: Validate prerendered HTML
        run: npm run validate:prerender

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-prerendered
          path: dist
          retention-days: 7

      - name: Deploy to Cloudflare Worker (assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Defina secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          WORKER_NAME="${{ secrets.CLOUDFLARE_WORKER_NAME }}"
          if [ -z "$WORKER_NAME" ]; then
            WORKER_NAME="easypdf"
          fi
          echo "Deploying dist/ → Cloudflare Worker (assets): $WORKER_NAME"
          echo "NOT using pages deploy — this is a Worker project (see wrangler.toml)"
          npx --yes wrangler@3 deploy \
            --config wrangler.toml \
            --name "$WORKER_NAME"
