# Deploy com HTML pré-renderizado de verdade → Cloudflare Pages
#
# Por quê: o build nativo do Cloudflare não tem libs do Chromium (sem sudo).
# O fail-soft do prerender evita deploy quebrado, mas deixa SPA crua em produção.
#
# Este workflow usa a imagem oficial do Playwright (Chromium + deps) e só
# faz deploy do dist/ depois de validar easypdf-prerender nas rotas-chave.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token com permissão Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  — Account ID do dashboard Cloudflare
#   CLOUDFLARE_PAGES_PROJECT_NAME — (opcional) default: easypdflocal
#
# Importante: desative o "Builds" automático no painel Cloudflare Pages
# (ou deixe Build command vazio / desconecte o deploy por push) para não
# sobrescrever este dist pré-renderizado com um build SPA fail-soft.
#
# Docs: docs/PRERENDER.md

name: Build (Playwright prerender) + Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Prerender + Deploy
    # Imagem com Chromium + dependências de sistema (alinhada ao playwright do package.json)
    runs-on: ubuntu-22.04
    # Chromium + libs do SO (o build do painel CF não tem isso)
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy

    env:
      # Browser deve funcionar — não aceitar fail-soft / SPA crua
      PRERENDER_STRICT: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A imagem já inclui Node; setup-node alinha versão e habilita cache npm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Garante o Chromium do pacote npm (a imagem já tem deps de sistema)
      - name: Ensure Playwright Chromium
        run: npx playwright install chromium

      - name: Build (tsc + vite + prerender)
        run: npm run build

      - name: Validate prerendered HTML
        run: npm run validate:prerender

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-prerendered
          path: dist
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Defina secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no repositório GitHub"
            exit 1
          fi
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="easypdflocal"
          fi
          echo "Deploying dist/ → Cloudflare Pages project: $PROJECT_NAME (branch main)"
          npx --yes wrangler@3 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
